services:
  project-db:
    image: mysql:8.0.32
    container_name: project_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: propify
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - project_mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    container_name: redis
    command: redis-server --requirepass redispassword --save ""
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
  app:
    build: ./PropifyBackend
    working_dir: /var/www/html
    environment: &backend-environment
      DB_CONNECTION: mysql
      DB_HOST: project-db
      DB_PORT: 3306
      DB_DATABASE: propify
      DB_USERNAME: user
      DB_PASSWORD: user
      DB_URL: ""
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
      REDIS_URL: ""
    volumes: &backend-volumes
      - ./PropifyBackend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      project-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./PropifyBackend:/var/www/html
      - ./PropifyBackend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

  queue:
    build: ./PropifyBackend
    working_dir: /var/www/html
    entrypoint: ["php", "artisan"]
    command: ["queue:work"]
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    command: ["sh", "-c", "npm ci && exec npm run dev -- --host 0.0.0.0 --strictPort"]
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./PropifyFrontend:/app
      - frontend_node_modules:/app/node_modules

networks:
  app-network:

volumes:
  project_mysql_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
